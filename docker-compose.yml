name: product-import

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev            # для продакшена: target: prod
      network: host
    image: product-import-app
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - imports:/var/www/html/storage/imports
      - images:/var/www/html/storage/images
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: product-import-app
    command: ["php", "bin/worker.php"]
    user: www-data
    env_file: .env
    volumes:
      - imports:/var/www/html/storage/imports
      - images:/var/www/html/storage/images
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - images:/srv/uploads:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  dbdata:
  imports:
  images:
